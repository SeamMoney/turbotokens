name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check replay harness failure detection
        run: python -m unittest discover -s rust/bench -p test_live_replay.py -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --features fetch-litellm-pricing -- -D warnings
      # The pricing::tests::embedded tests assert against a pinned pricing
      # snapshot and fail on fresh downloads when upstream pricing drifts;
      # the fuzzy-match test breaks when LiteLLM adds a model that a fuzzy
      # pattern now legitimately matches (e.g. claude-opus-5).
      - run: cargo test --workspace --features fetch-litellm-pricing -- --skip pricing::tests::embedded --skip pricing::tests::fuzzy_match_allows_date_like_suffixes_for_known_numeric_model_versions
      - name: Check fish completion behavior
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fish
          fish --version
          cargo test -p turbotokens --features fetch-litellm-pricing commands::completions::tests::fish_completes_empty_and_partial_contexts_without_errors -- --ignored
      - run: cargo build --release --bin turbotokens --features fetch-litellm-pricing

  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test npm launcher lifecycle
        run: npm test --prefix npm
      - name: Verify npm package and native launcher
        run: node packaging/smoke-npm.cjs
      - name: Test shell installer
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s packaging/tests -v
